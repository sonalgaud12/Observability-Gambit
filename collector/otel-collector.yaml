# The Observability Gambit: vendor-neutral Collector pipeline.
#
#   chess-agent --OTLP--> [this Collector]
#        traces/all      -> ClickHouse (SQL correlation), OTLP-JSON file (dataset + replay), spanmetrics
#        traces/sampled  -> tail_sampling -> Jaeger  (only the interesting traces)
#        metrics         -> Prometheus (RED metrics per model and per move class, with exemplars)
#
# The point of the two trace pipelines: the analysis store keeps everything,
# while the trace UI keeps only what a human should look at, decided AFTER the
# grader has labeled the move. Head sampling in the SDK could never do that.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  batch:
    send_batch_size: 1024
    timeout: 2s

  # Decide per trace once the whole move (decision + grading) has arrived.
  tail_sampling:
    decision_wait: 15s
    num_traces: 50000
    expected_new_traces_per_sec: 50
    policies:
      - name: keep-blunders-and-mistakes
        type: string_attribute
        string_attribute:
          key: chess.move.class
          values: [blunder, mistake]
      - name: keep-illegal-move-retries
        type: numeric_attribute
        numeric_attribute:
          key: chess.illegal_attempts
          min_value: 1
          max_value: 1000
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow-decisions
        type: latency
        latency:
          threshold_ms: 20000
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

connectors:
  spanmetrics:
    namespace: gambit
    histogram:
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 20s, 40s, 80s]
    dimensions:
      - name: gen_ai.request.model
      - name: gen_ai.operation.name
      - name: gen_ai.provider.name
      - name: chess.move.class
      - name: error.type
    exemplars:
      enabled: true
    metrics_flush_interval: 15s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    traces_table_name: otel_traces
    create_schema: true
    timeout: 10s
    retry_on_failure:
      enabled: true

  # Every span, as OTLP JSON lines. Re-ingest later with collector/replay.yaml.
  file/raw:
    path: /data/traces/traces.jsonl
    rotation:
      max_megabytes: 200
      max_backups: 20

  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true # required for exemplars
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces/all:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse, file/raw, spanmetrics]
    traces/sampled:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp/jaeger]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [prometheus]
