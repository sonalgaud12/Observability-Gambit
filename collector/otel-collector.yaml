# The Observability Gambit: vendor-neutral Collector pipeline.
#
#   chess-agent --OTLP--> [this Collector]
#        traces/all      -> ClickHouse (SQL correlation), OTLP-JSON file (dataset + replay), spanmetrics,
#                           Tempo (every trace, so every "Open trace" link resolves)
#        metrics         -> Prometheus (RED metrics per model and per move class, with exemplars)
#        metrics/genai   -> Prometheus (the SDK's gen_ai.* convention metrics)
#        logs/genai      -> ClickHouse + OTLP-JSON file (gen_ai.* events, e.g. gen_ai.evaluation.result)
#
# Nothing is sampled out: the UI links every move of every game, so Tempo gets
# every trace (local disk, a game is a few hundred spans). The earlier design
# kept only blunders, retries, errors and a 10% baseline in the trace UI, which
# made links on the other moves read "trace not found".

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  batch:
    send_batch_size: 1024
    timeout: 2s

connectors:
  spanmetrics:
    namespace: gambit
    histogram:
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 20s, 40s, 80s]
    dimensions:
      - name: gen_ai.request.model
      - name: gen_ai.operation.name
      - name: gen_ai.provider.name
      - name: chess.move.class
      - name: error.type
    exemplars:
      enabled: true
    metrics_flush_interval: 15s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    create_schema: true
    timeout: 10s
    retry_on_failure:
      enabled: true

  # Every span, as OTLP JSON lines. Re-ingest later with collector/replay.yaml.
  file/raw:
    path: /data/traces/traces.jsonl
    rotation:
      max_megabytes: 200
      max_backups: 20

  # Every GenAI event (gen_ai.evaluation.result, *.exception, ...), as OTLP JSON lines.
  file/events:
    path: /data/events/events.jsonl
    rotation:
      max_megabytes: 100
      max_backups: 10

  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true # required for exemplars
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces/all:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse, file/raw, spanmetrics, otlp/tempo]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [prometheus]
    # gen_ai.client.inference.*, gen_ai.invoke_agent.*, gen_ai.execute_tool.duration
    # from the SDK. Prometheus names them e.g. gen_ai_client_inference_duration_seconds.
    metrics/genai:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs/genai:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse, file/events]
