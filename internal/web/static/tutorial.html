<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observability Gambit · tutorial</title>
<style>
  html { scrollbar-gutter: stable; }
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #262d36; --text: #e6edf3; --muted: #8b949e;
    --light-sq: #d9d4c7; --dark-sq: #7a8b6f; --accent: #58a6ff;
    --best: #3fb950; --good: #8fbc8f; --inaccuracy: #e3b341; --mistake: #f0883e; --blunder: #f85149;
    --risk: #58a6ff; --risk2: #bc8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--muted); font-weight: 400; }
  nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.tabs a { color: var(--muted); text-decoration: none; font-weight: 600; padding: 5px 12px; border-radius: 6px; border: 1px solid transparent; }
  nav.tabs a:hover { color: var(--text); border-color: var(--line); }
  nav.tabs a[aria-current="page"] { color: var(--text); background: var(--panel); border-color: var(--line); }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
  a.btn { display: inline-block; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; text-decoration: none; font-weight: 600; }
  a.btn:hover { border-color: var(--accent); }
  a.btn.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); }
  a.btn.off { opacity: .55; pointer-events: none; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .mock { background: #5a1e1e; color: #ffb3ad; }
  .muted { color: var(--muted); }
  code { background: #0b0f14; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; color: var(--muted); }

  main { display: grid; grid-template-columns: min(560px, 100%) minmax(0, 1fr); gap: 24px; padding: 20px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px; } header { padding: 12px 16px; } }

  #board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); aspect-ratio: 1; width: 100%; container-type: inline-size; border-radius: 6px; overflow: hidden; box-shadow: 0 6px 30px #0008; }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; font-size: 9.5cqw; user-select: none; }
  .sq.l { background: var(--light-sq); } .sq.d { background: var(--dark-sq); }
  .sq.last::after { content: ""; position: absolute; inset: 0; background: #f7e36a66; }
  .sq.best::before { content: ""; position: absolute; inset: 3px; border: 4px solid var(--best); border-radius: 4px; z-index: 2; }
  .sq.blunder::after { background: #f8514988; }
  .sq.emph::before { content: ""; position: absolute; inset: 3px; border: 4px solid var(--accent); border-radius: 4px; z-index: 2; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .sq.emph::before { animation: none; } }
  .pc { position: relative; z-index: 1; line-height: 1; }
  .pc.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 1px 3px #000c; }
  .pc.b { color: #111; text-shadow: 0 0 2px #fff6; }
  .coord { position: absolute; font-size: 11px; color: #0007; left: 3px; top: 1px; font-weight: 600; }
  .coord.file { left: auto; top: auto; right: 3px; bottom: 1px; }
  #board.coords .coord { color: #0b1220; background: var(--accent); border-radius: 3px; padding: 0 4px; font-size: 12px; z-index: 3; }
  .boardnote { margin: 10px 2px 0; font-size: 13px; color: var(--muted); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; overflow-wrap: anywhere; }
  .stepno { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .panel h2 { margin: 4px 0 10px; font-size: 24px; line-height: 1.2; }
  .panel p { margin: 0 0 10px; }
  .panel ul { margin: 0 0 10px; padding-left: 20px; } .panel li { margin: 3px 0; }
  .stepnav { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .dots { display: flex; gap: 6px; margin: 0 auto; }
  .dots button { width: 14px; height: 14px; padding: 0; border-radius: 50%; border: 1px solid var(--muted); background: transparent; }
  .dots button[aria-current="step"] { background: var(--accent); border-color: var(--accent); }
  .dots button:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tree { list-style: none; margin: 8px 0 12px; padding: 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tree ul { list-style: none; margin: 0; padding-left: 18px; border-left: 1px solid var(--line); }
  .tree li { margin: 0; padding: 3px 0; }
  .tree .n { color: var(--text); font-weight: 700; }
  .tree .t { color: var(--muted); }
  .tree .err .n { color: var(--blunder); }
  .tree .w { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--muted); font-size: 12.5px; display: block; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .chip { background: #0b0f14; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .chip b { color: var(--muted); font-weight: 500; margin-right: 4px; }
  .chip.hot { border-color: var(--mistake); color: var(--mistake); }
  .rowlabel { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-top: 8px; }
  dl.keys { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 8px 0 0; font-size: 14px; }
  dl.keys dt { color: var(--muted); } dl.keys dd { margin: 0; }
  .cls { font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 700; text-transform: uppercase; color: #0b1220; display: inline-block; }
  .grades { display: grid; gap: 6px; margin: 8px 0 12px; }
  .grades div { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grades .cls { min-width: 96px; text-align: center; }
  .callout { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; border: 1px dashed var(--line); }
  .callout.alert { border-color: var(--blunder); background: #f851491a; }
  #tl { width: 100%; height: auto; aspect-ratio: 600 / 200; background: #0b0f14; border: 1px solid var(--line); border-radius: 10px; }
  #tl text { fill: var(--muted); font-size: 11px; }
  .legend { display: flex; gap: 6px 16px; color: var(--muted); font-size: 13px; margin: 6px 2px 10px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; background: currentColor; }
  @media (max-width: 900px) { .keyhint { display: none; } .dots { gap: 4px; } .dots button { width: 22px; height: 22px; } }
  .ctas { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 6px; }
  /* Lesson tokens: derived from the app's own variables so a re-theme follows them. */
  :root { --move: var(--accent); --capture: var(--mistake); --special: var(--risk2); --danger: var(--blunder); --select: #f7e36a; }
  .sq[data-sq] { cursor: default; }
  .board-live .sq[data-sq] { cursor: pointer; }
  .sq:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 4; }
  .sq.sel::after { content: ""; position: absolute; inset: 0; background: #f7e36a99; }
  .sq.chk::after { content: ""; position: absolute; inset: 0; background: #f8514999; }
  .sq.tgt::before { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: var(--move); opacity: .9; z-index: 2; box-shadow: 0 0 0 2px #0b122066; }
  .sq.tgt.cap::before { width: 88%; height: 88%; background: transparent; border: 5px solid var(--capture); box-shadow: none; }
  .sq.tgt.sp::before { width: 88%; height: 88%; background: transparent; border: 5px solid var(--special); box-shadow: none; }
  .sq.danger::after { content: "✕"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 8cqw; font-weight: 700; color: var(--danger); text-shadow: 0 0 3px #000, 0 0 6px #000; z-index: 3; }
  .boardnote { min-height: 2.9em; }

  .parts { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px 0 12px; }
  .parts button { flex: 1 1 200px; text-align: left; font-weight: 600; color: var(--muted); }
  .parts button[aria-current="true"] { color: var(--text); border-color: var(--accent); background: #58a6ff1a; }
  .langs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-left: auto; }
  .langs button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 5px 12px; font-weight: 600; }
  .langs button[aria-pressed="true"] { background: var(--accent); color: #0b1220; }
  .headright { display: flex; align-items: center; gap: 10px 14px; margin-left: auto; flex-wrap: wrap; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; text-align: left; }
  .linkbtn:hover { color: var(--text); }
  .skip { margin-top: 14px; }
  table.ptab { border-collapse: collapse; width: 100%; margin: 8px 0 10px; font-size: 14px; }
  .ptab th { color: var(--muted); font-weight: 500; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .ptab th, .ptab td { padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line); }
  .pcg { font-size: 24px; line-height: 1; }
  .lessontools { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; gap: 10px; }
  .exbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .exbtns button[aria-pressed="true"] { border-color: var(--accent); background: #58a6ff1a; }
  .key { display: flex; gap: 6px 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .key i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border-radius: 50%; }
  .key .k-move { background: var(--move); }
  .key .k-cap { border: 3px solid var(--capture); }
  .key .k-sp { border: 3px solid var(--special); }
  .key .k-chk { background: #f8514999; border-radius: 2px; }
  .key .k-x { width: auto; height: auto; color: var(--danger); font-style: normal; font-weight: 700; }
  .promo { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .promo button { font-size: 15px; }
  ol { padding-left: 22px; } .panel ol li { margin: 6px 0; }
  :lang(ja) { line-height: 1.7; }
  html[lang="ja"] .panel h2 { line-height: 1.35; }
  html[lang="ja"] .stepno, html[lang="ja"] .rowlabel { text-transform: none; letter-spacing: 0; }
  .stepnav .dots { order: 3; width: 100%; justify-content: center; flex-wrap: wrap; margin: 6px 0 0; }
  .stepnav #next { margin-left: auto; }
</style>

      <button type="button" id="langEn" data-lang="en" lang="en">English</button>

  </div>
</header>

<main>

    <div id="board" aria-label="Chess board"></div>
    <div class="boardnote" id="boardNote" role="status" aria-live="polite"></div>
  </div>
  <div class="panel" id="panel"></div>
</main>

 "rook": {"fen":"6k1/3p4/8/8/1p1R4/8/3P4/7K w - - 0 1","select":"d4","moves":{"d2":[{"to":"d3","kind":"move","after":"6k1/3p4/8/8/1p1R4/3P4/8/7K b - - 0 1"}],"d4":[{"to":"b4","kind":"move","capture":true,"after":"6k1/3p4/8/8/1R6/8/3P4/7K b - - 0 1"},{"to":"c4","kind":"move","after":"6k1/3p4/8/8/1pR5/8/3P4/7K b - - 1 1"},{"to":"d3","kind":"move","after":"6k1/3p4/8/8/1p6/3R4/3P4/7K b - - 1 1"},{"to":"d5","kind":"move","after":"6k1/3p4/8/3R4/1p6/8/3P4/7K b - - 1 1"},{"to":"d6","kind":"move","after":"6k1/3p4/3R4/8/1p6/8/3P4/7K b - - 1 1"},{"to":"d7","kind":"move","capture":true,"after":"6k1/3R4/8/8/1p6/8/3P4/7K b - - 0 1"},{"to":"e4","kind":"move","after":"6k1/3p4/8/8/1p2R3/8/3P4/7K b - - 1 1"},{"to":"f4","kind":"move","after":"6k1/3p4/8/8/1p3R2/8/3P4/7K b - - 1 1"},{"to":"g4","kind":"move","check":true,"after":"6k1/3p4/8/8/1p4R1/8/3P4/7K b - - 1 1"},{"to":"h4","kind":"move","after":"6k1/3p4/8/8/1p5R/8/3P4/7K b - - 1 1"}],"h1":[{"to":"g1","kind":"move","after":"6k1/3p4/8/8/1p1R4/8/3P4/6K1 b - - 1 1"},{"to":"g2","kind":"move","after":"6k1/3p4/8/8/1p1R4/8/3P2K1/8 b - - 1 1"},{"to":"h2","kind":"move","after":"6k1/3p4/8/8/1p1R4/8/3P3K/8 b - - 1 1"}]}},
 "stalemate": {"fen":"7k/5Q2/6K1/8/8/8/8/8 b - - 0 1","select":"h8","moves":{"h8":[]}},
 "start": {"fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1","moves":{"a1":[],"a2":[{"to":"a3","kind":"move","after":"rnbqkbnr/pppppppp/8/8/8/P7/1PPPPPPP/RNBQKBNR b KQkq - 0 1"},{"to":"a4","kind":"move","after":"rnbqkbnr/pppppppp/8/8/P7/8/1PPPPPPP/RNBQKBNR b KQkq a3 0 1"}],"b1":[{"to":"a3","kind":"move","after":"rnbqkbnr/pppppppp/8/8/8/N7/PPPPPPPP/R1BQKBNR b KQkq - 1 1"},{"to":"c3","kind":"move","after":"rnbqkbnr/pppppppp/8/8/8/2N5/PPPPPPPP/R1BQKBNR b KQkq - 1 1"}],"b2":[{"to":"b3","kind":"move","after":"rnbqkbnr/pppppppp/8/8/8/1P6/P1PPPPPP/RNBQKBNR b KQkq - 0 1"},{"to":"b4","kind":"move","after":"rnbqkbnr/pppppppp/8/8/1P6/8/P1PPPPPP/RNBQKBNR b KQkq b3 0 1"}],"c1":[],"c2":[{"to":"c3","kind":"move","after":"rnbqkbnr/pppppppp/8/8/8/2P5/PP1PPPPP/RNBQKBNR b KQkq - 0 1"},{"to":"c4","kind":"move","after":"rnbqkbnr/pppppppp/8/8/2P5/8/PP1PPPPP/RNBQKBNR b KQkq c3 0 1"}],"d1":[],"d2":[{"to":"d3","kind":"move","after":"rnbqkbnr/pppppppp/8/8/8/3P4/PPP1PPPP/RNBQKBNR b KQkq - 0 1"},{"to":"d4","kind":"move","after":"rnbqkbnr/pppppppp/8/8/3P4/8/PPP1PPPP/RNBQKBNR b KQkq d3 0 1"}],"e1":[],"e2":[{"to":"e3","kind":"move","after":"rnbqkbnr/pppppppp/8/8/8/4P3/PPPP1PPP/RNBQKBNR b KQkq - 0 1"},{"to":"e4","kind":"move","after":"rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1"}],"f1":[],"f2":[{"to":"f3","kind":"move","after":"rnbqkbnr/pppppppp/8/8/8/5P2/PPPPP1PP/RNBQKBNR b KQkq - 0 1"},{"to":"f4","kind":"move","after":"rnbqkbnr/pppppppp/8/8/5P2/8/PPPPP1PP/RNBQKBNR b KQkq f3 0 1"}],"g1":[{"to":"f3","kind":"move","after":"rnbqkbnr/pppppppp/8/8/8/5N2/PPPPPPPP/RNBQKB1R b KQkq - 1 1"},{"to":"h3","kind":"move","after":"rnbqkbnr/pppppppp/8/8/8/7N/PPPPPPPP/RNBQKB1R b KQkq - 1 1"}],"g2":[{"to":"g3","kind":"move","after":"rnbqkbnr/pppppppp/8/8/8/6P1/PPPPPP1P/RNBQKBNR b KQkq - 0 1"},{"to":"g4","kind":"move","after":"rnbqkbnr/pppppppp/8/8/6P1/8/PPPPPP1P/RNBQKBNR b KQkq g3 0 1"}],"h1":[],"h2":[{"to":"h3","kind":"move","after":"rnbqkbnr/pppppppp/8/8/8/7P/PPPPPPP1/RNBQKBNR b KQkq - 0 1"},{"to":"h4","kind":"move","after":"rnbqkbnr/pppppppp/8/8/7P/8/PPPPPPP1/RNBQKBNR b KQkq h3 0 1"}]}}
}}
</script>

<script src="tutorial-core.js"></script>
<script src="tutorial-text.js"></script>
<script>
const Core = TutorialCore;
const { TEXT, pieceLabel, pieceShort } = TutorialText;
const SAMPLE = JSON.parse(document.getElementById("sample-game").textContent);
const LESSONS = JSON.parse(document.getElementById("chess-lessons").textContent).positions;
const CLASS_COLOR = { best: "var(--best)", good: "var(--good)", inaccuracy: "var(--inaccuracy)", mistake: "var(--mistake)", blunder: "var(--blunder)" };
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => (k in v ? v[k] : "{" + k + "}"));
let live = null; // /api/config's live block, when a server with human mode is behind this page

// The tutorial in two parts. Part 1 steps show a lesson position (LESSONS) the learner can click;
// Part 2 steps show the sample game at some ply. Their words live in tutorial-text.js, by id.
const CENTRE = ["d4", "e4", "d5", "e5"];
const PARTS = {
  1: [
    { id: "goal", pos: "start", moves: false },
    { id: "board", pos: "start", moves: false, coords: true },
    { id: "rook", pos: "rook" }, { id: "bishop", pos: "bishop" }, { id: "queen", pos: "queen" },
    { id: "knight", pos: "knight" }, { id: "king", pos: "king" }, { id: "pawn", pos: "pawn" },
    { id: "check", pos: "check" }, { id: "checkmate", pos: "checkmate" },
    { id: "draw", examples: ["stalemate", "kings"] },
    { id: "castle", examples: ["castle", "castle-blocked"] },
    { id: "enpassant", examples: ["enpassant", "enpassant-late"] },
    { id: "promotion", examples: ["promotion", "promotion-capture"] },
    { id: "ideas", board: { ply: 9, emph: CENTRE } },
    { id: "bridge", board: { ply: 16 } },
  ],
  2: [
    { id: "watching", board: { ply: 0 } },
    { id: "notation", board: { ply: 3, coords: true, emph: ["f3"] } },
    { id: "trace", board: { ply: 14 } },
    { id: "numbers", board: { ply: 14 } },
    { id: "grading", board: { ply: 15, blunder: true, best: ["g3"] } },
    { id: "predict", board: { ply: 14 } },
    { id: "try", board: { ply: 16 } },
  ],
};
const COUNTS = { 1: PARTS[1].length, 2: PARTS[2].length };

// ---- the sample game (Part 2) ----
const plies = SAMPLE.plies;
const agentMove = (n) => plies.find(p => p.by_agent && p.agent.move_number === n).agent;
const sanOf = (a) => plies.find(p => p.by_agent && p.agent === a).san;
const fenAt = (i) => i === 0 ? SAMPLE.start_fen : plies[i - 1].fen_after;
const fmtCP = (cp) => (cp >= 0 ? "+" : "") + (cp / 100).toFixed(1);

// ---- state ----
let route = { part: 1, step: 1, lang: "en" };
let L = null; // lesson state: { ex, sel, after, last, promo, msg }

const stepNow = () => PARTS[route.part][route.step - 1];
const T = () => TEXT[route.lang];
const lessonId = (s, ex) => s.examples ? s.examples[ex] : s.pos;

function newLesson(ex = 0) {
  const s = stepNow(), id = lessonId(s, ex);
  const pos = id ? LESSONS[id] : null;
  return { ex, sel: pos && s.moves !== false && pos.select ? pos.select : null, after: null, last: null, promo: null, msg: "" };
}

function pieceName(ch) { return pieceShort(route.lang, ch); }
function selMessage(pos, sq) {
  const ch = Core.pieceAt(pos.fen, sq), u = T().ui;
  if (!ch) return fmt(u.sqName, { sq, what: u.empty });
  const piece = pieceName(ch);
  const sel = Core.selection(pos, sq);
  if (sel.kind !== "piece" || stepNow().moves === false) return fmt(u.sqName, { sq, what: piece });
  const n = sel.moves.length;
  return n ? fmt(u.picked, { piece, sq, n, moves: n === 1 ? u.moveWord1 : u.moveWordN }) : fmt(u.pickedNone, { piece, sq });
}

// ---- board ----
// fen: what to draw. coords: spotlight the a-h and 1-8 labels. sel/targets/check/danger/last: lesson overlays.
// emph: squares to ring in blue. best: the engine's preferred squares, green. blunder: tint the last move red.
function drawBoard({ fen, coords = false, sel = null, targets = [], check = "", danger = [], last = [], emph = [], best = [], blunder = false, lesson = false }) {
  const cells = Core.parseFEN(fen);
  const tmap = {}; for (const m of targets) tmap[m.to] = m;
  const html = [];
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const sq = "abcdefgh"[f] + (8 - r);
      const c = cells[r * 8 + f];
      const cls = ["sq", (r + f) % 2 === 0 ? "l" : "d"];
      if (last.includes(sq)) { cls.push("last"); if (blunder) cls.push("blunder"); }
      if (best.includes(sq)) cls.push("best");
      if (emph.includes(sq)) cls.push("emph");
      if (sel === sq) cls.push("sel");
      if (check === sq) cls.push("chk");
      if (danger.includes(sq)) cls.push("danger");
      const tm = tmap[sq];
      if (tm) cls.push("tgt", tm.capture ? "cap" : tm.kind !== "move" ? "sp" : "m");
      if (tm && tm.kind !== "move" && !tm.capture) { /* special non-capture: ring */ }
      if (tm && tm.kind !== "move" && tm.capture && tm.kind !== "promotion") cls.push("cap");
      let inner = "";
      if (f === 0) inner += `<span class="coord">${8 - r}</span>`;
      if (r === 7) inner += `<span class="coord file">${"abcdefgh"[f]}</span>`;
      if (c) inner += `<span class="pc ${c === c.toUpperCase() ? "w" : "b"}">${GLYPH[c.toLowerCase()]}︎</span>`;
      const label = c ? `${sq}, ${pieceName(c)}` : sq;
      html.push(`<div class="${cls.join(" ")}" data-sq="${sq}" title="${sq}" aria-label="${esc(label)}" ${lesson && (tm || (c && sel !== null)) ? 'role="button" tabindex="0"' : ""}>${inner}</div>`);
    }
  }
  const b = $("#board");
  b.classList.toggle("coords", coords);
  b.classList.toggle("board-live", true);
  b.innerHTML = html.join("");
}

function renderBoard() {
  const s = stepNow();
  const id = lessonId(s, L ? L.ex : 0);
  if (id) {
    const pos = LESSONS[id];
    const pend = L.promo;
    const targets = (L.sel && !L.after && !pend && s.moves !== false) ? Core.selection(pos, L.sel).moves : [];
    drawBoard({
      fen: L.after || pos.fen, coords: !!s.coords, sel: L.after ? null : L.sel, targets, lesson: true,
      check: L.after ? "" : (pos.check || ""), danger: (L.sel && !L.after && pos.danger) || [], last: L.last || [],
    });
  } else {
    const b = s.board;
    const cur = b.ply > 0 ? plies[b.ply - 1] : null;
    drawBoard({ fen: fenAt(b.ply), coords: !!b.coords, emph: b.emph || [], best: b.best || [], blunder: !!b.blunder, last: cur ? [cur.uci.slice(0, 2), cur.uci.slice(2, 4)] : [] });
  }
}

// ---- Part 2 pieces ----
const chip = (k, v, hot) => `<span class="chip ${hot ? "hot" : ""}"><b>${esc(k)}</b>${v}</span>`;
function chips(a) {
  const n = T().steps.numbers.chipNames;
  return `<div class="chips">${chip(n.latency, (a.latency_ms / 1000).toFixed(2) + "s")}${chip(n.chat, a.chat_calls, a.chat_calls > 1)}
    ${chip(n.inTok, a.input_tokens)}${chip(n.outTok, a.output_tokens)}${chip(n.tool, a.tool_calls)}
    ${chip(n.illegal, a.illegal_attempts, a.illegal_attempts > 0)}</div>`;
}

function timeline() {
  const W = 600, H = 200, L = 40, R = 14, T0 = 14, B = 46;
  const P = T().steps.predict;
  const ag = plies.filter(p => p.by_agent).map(p => p.agent);
  const x = n => L + (W - L - R) * (n - 1) / (ag.length - 1);
  const y = v => T0 + (H - T0 - B) * (1 - v);
  let s = "";
  for (const v of [0, .25, .5, .75, 1]) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="6" y="${y(v) + 4}">${v * 100}%</text>`;
  s += `<line x1="${L}" x2="${W - R}" y1="${y(SAMPLE.threshold)}" y2="${y(SAMPLE.threshold)}" stroke="var(--muted)" stroke-dasharray="2 4"/>`;
  const line = (name, color, dash) => `<polyline fill="none" stroke="${color}" stroke-width="2.2" ${dash ? 'stroke-dasharray="5 4"' : ""} points="${ag.map(a => x(a.move_number) + "," + y(a.risk[name])).join(" ")}"/>`;
  s += line("at_move", "var(--risk2)", true) + line("forecast", "var(--risk)", false);
  for (const a of ag) {
    const big = a.class === "blunder" || a.class === "mistake";
    s += `<circle cx="${x(a.move_number)}" cy="${H - B + 16}" r="${big ? 6 : 3.5}" fill="${CLASS_COLOR[a.class]}"><title>${esc(fmt(P.timelineMove, { n: a.move_number, san: sanOf(a), cls: a.class }))}</title></circle><text x="${x(a.move_number) - 3}" y="${H - 6}">${a.move_number}</text>`;
  }
  const last = ag[ag.length - 1];
  s += `<circle cx="${x(last.move_number)}" cy="${y(last.risk.forecast)}" r="5" fill="var(--risk)" stroke="var(--text)" stroke-width="1.5"/>`;
  return `<svg id="tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(P.timelineLabel)}">${s}</svg>`;
}

// ---- panel ----
function lessonTools(s) {
  const id = lessonId(s, L.ex), pos = LESSONS[id], u = T().ui, txt = T().steps[s.id];
  let h = "";
  if (s.examples) {
    h += `<div class="exbtns" role="group">${s.examples.map((e, i) => `<button type="button" data-ex="${i}" aria-pressed="${i === L.ex}">${esc(txt.examples[e])}</button>`).join("")}</div>`;
  }
  if (s.moves !== false) {
    const all = Object.values(pos.moves).flat();
    const key = [`<span><i class="k-move"></i>${u.legendMove}</span>`];
    if (all.some(m => m.capture)) key.push(`<span><i class="k-cap"></i>${u.legendCapture}</span>`);
    if (all.some(m => m.kind !== "move" && !m.capture)) key.push(`<span><i class="k-sp"></i>${u.legendSpecial}</span>`);
    if (pos.danger) key.push(`<span><i class="k-x">✕</i>${u.legendDanger}</span>`);
    if (pos.check) key.push(`<span><i class="k-chk"></i>${u.legendCheck}</span>`);
    h += `<div class="key">${key.join("")}</div>`;
    if (L.promo) {
      h += `<div class="promo"><span>${u.promoteTo}</span>${["q", "r", "b", "n"].map(p => `<button type="button" data-promo="${p}">${GLYPH[p]}︎ ${esc(pieceName(p).split(" (")[0].replace(/^(White|Black|白の|黒の) ?/i, ""))}</button>`).join("")}</div>`;
    }
    h += `<div><button type="button" id="reset">${u.reset}</button></div>`;
  }
  return h ? `<div class="lessontools">${h}</div>` : "";
}

function render() {
  const s = stepNow(), u = T().ui, txt = T().steps[s.id];
  const idx = Core.flatIndex(route, COUNTS), total = COUNTS[1] + COUNTS[2];
  if (!L) L = newLesson(0);
  renderBoard();
  $("#boardNote").textContent = L.msg || txt.note || "";
  const ctx = { ui: u, p: (ch) => pieceLabel(route.lang, ch), chips, timeline, fmtCP, live, a3: agentMove(3), a8: agentMove(8) };
  const dots = PARTS[route.part].map((st, i) => `<button type="button" data-i="${i + 1}" aria-label="${esc(fmt(u.stepLabel, { i: i + 1, title: T().steps[st.id].title }))}" ${i + 1 === route.step ? 'aria-current="step"' : ""}></button>`).join("");
  const tabs = [1, 2].map(p => `<button type="button" data-goto="part${p}" ${p === route.part ? 'aria-current="true"' : ""}>${esc(u["part" + p])}</button>`).join("");
  const skip = route.part === 2 ? `<p class="muted" style="margin:10px 0 0"><button type="button" class="linkbtn" data-goto="part1">${u.backToPart1}</button></p>` : "";
  const atEnd1 = route.part === 1 && route.step === COUNTS[1];
  $("#panel").innerHTML = `<div class="parts" role="group" aria-label="${esc(u.parts)}">${tabs}</div>
    <div class="stepno">${fmt(u.stepOf, { i: route.step, n: COUNTS[route.part] })} · ${esc(u["part" + route.part + "Short"])}</div><h2>${esc(txt.title)}</h2>${txt.body(ctx)}
    ${s.id === "board" || s.moves === false ? "" : ""}${PARTS[route.part][route.step - 1].pos || s.examples ? lessonTools(s) : ""}
    <div class="stepnav"><button type="button" id="back" ${idx === 0 ? "disabled" : ""}>${u.back}</button>
    <button type="button" id="next" class="primary" ${idx === total - 1 ? "disabled" : ""}>${atEnd1 ? u.startPart2 : u.next}</button>
    <div class="dots">${dots}</div></div>${skip}`;
  $("#back").onclick = () => go(idx - 1);
  $("#next").onclick = () => go(idx + 1);
  document.querySelectorAll(".dots button").forEach(b => b.onclick = () => goRoute({ ...route, step: +b.dataset.i }));
  chrome();
  syncURL();
}

// Everything outside the panel: header words, language buttons, the page's own language and title.
function chrome() {
  const u = T().ui;
  document.documentElement.lang = route.lang;
  document.title = "Observability Gambit · " + (route.lang === "ja" ? "チュートリアル" : "tutorial");
  $("#h1t").textContent = u.title; $("#h1s").textContent = u.sub;
  $("#tabRec").textContent = u.tabRecorded; $("#liveTab").textContent = u.tabLive; $("#tabTut").textContent = u.tabTutorial;
  $("#liveTab").hidden = !live;
  const b = $("#badge"); b.textContent = u.badge; b.title = u.badgeTitle; b.hidden = route.part !== 2;
  $("#keyhint").textContent = u.keyhint;
  $("#langs").setAttribute("aria-label", u.language);
  document.querySelectorAll("#langs button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.lang === route.lang)));
}

function syncURL() {
  try { history.replaceState(null, "", Core.routeSearch(route, location.search)); } catch (e) { /* e.g. a sandboxed frame */ }
}

function goRoute(r) {
  const same = r.part === route.part && r.step === route.step;
  route = { ...route, part: r.part, step: Math.max(1, Math.min(COUNTS[r.part], r.step)) };
  if (!same) L = null;
  render();
}
function go(i) { goRoute({ ...Core.fromFlat(i, COUNTS) }); window.scrollTo?.({ top: 0 }); }

function setLang(lang) {
  if (!Core.LANGS.includes(lang)) return;
  route = { ...route, lang };
  Core.saveLang(window.localStorage, lang);
  if (L) L.msg = "";
  render();
}

// ---- lesson clicks ----
function onSquare(sq) {
  const s = stepNow(), id = lessonId(s, L.ex), u = T().ui;
  if (!id) { L.msg = fmt(u.sqName, { sq, what: (() => { const c = Core.pieceAt(fenAt(s.board.ply), sq); return c ? pieceName(c) : u.empty; })() }); $("#boardNote").textContent = L.msg; return; }
  const pos = LESSONS[id];
  if (L.after || L.promo) { if (L.after) { L = newLesson(L.ex); } else return; }
  else if (L.sel && s.moves !== false) {
    const m = Core.moveTo(pos, L.sel, sq);
    if (m) { play(pos, L.sel, m); return; }
  }
  const ch = Core.pieceAt(pos.fen, sq);
  const sel = s.moves !== false ? Core.selection(pos, sq) : { kind: "none" };
  L.sel = ch && sel.kind === "piece" && L.sel !== sq ? sq : null;
  L.msg = selMessage(pos, sq);
  render();
}

function play(pos, from, m) {
  const u = T().ui;
  if (m.promo) { L.promo = { from, m }; L.msg = ""; render(); return; }
  L.after = Core.resultFEN(m); L.last = [from, m.to]; L.sel = null;
  L.msg = fmt(m.kind === "castle" ? u.playedCastle : m.kind === "enpassant" ? u.playedEp : u.played, { from, to: m.to }) + " " + u.playedHint;
  render();
}

document.addEventListener("click", (e) => {
  const sq = e.target.closest("#board [data-sq]");
  if (sq) return onSquare(sq.dataset.sq);
  const g = e.target.closest("[data-goto]");
  if (g) return goRoute({ part: g.dataset.goto === "part2" ? 2 : 1, step: 1 });
  const ex = e.target.closest("[data-ex]");
  if (ex) { L = newLesson(+ex.dataset.ex); return render(); }
  const pr = e.target.closest("[data-promo]");
  if (pr && L && L.promo) {
    const { from, m } = L.promo, u = T().ui;
    L.after = Core.resultFEN(m, pr.dataset.promo); L.last = [from, m.to]; L.sel = null; L.promo = null;
    L.msg = fmt(u.playedPromo, { from, to: m.to, piece: pieceName(pr.dataset.promo.toUpperCase()).replace(/^(White |白の)/, "") }) + " " + u.playedHint;
    return render();
  }
  if (e.target.closest("#reset")) { L = newLesson(L.ex); return render(); }
  const lg = e.target.closest("#langs button");
  if (lg) setLang(lg.dataset.lang);
});

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const sq = e.target.closest && e.target.closest("#board [data-sq]");
  if (sq && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return onSquare(sq.dataset.sq); }
  if (e.key === "ArrowRight") go(Core.flatIndex(route, COUNTS) + 1);
  else if (e.key === "ArrowLeft") go(Core.flatIndex(route, COUNTS) - 1);
});

async function init() {
  let stored = null;
  try { stored = Core.loadLang(window.localStorage); } catch (e) { stored = null; }
  route = Core.parseRoute(location.search, COUNTS, stored);
  render();
  // Only the "Play the agent" tab and a link in Part 2 depend on a server; the rest is static.
  try {
    const cfg = await (await fetch("api/config")).json();
    live = cfg.live || null;
  } catch (e) { live = null; }
  render();
}
init();
</script>
</body>
</html>
